[general]
host = "0.0.0.0"
port = 6432
admin_username = "admin"
admin_password = "admin"
pool_mode = "transaction"
server_lifetime = 86400
idle_timeout = 30000
connect_timeout = 5000

[pools.postgres]
pool_size = 10
default_role = "primary"
# Enable query parser to detect read vs write queries
query_parser_enabled = true
# Enable read/write splitting based on query parsing
query_parser_read_write_splitting = true
# Allow primary to be used for reads (optional, set to false to only use replicas for reads)
primary_reads_enabled = false

[pools.postgres.users.0]
username = "postgres"
password = "password"
pool_size = 10

[pools.postgres.shards.0]
servers = [
    ["postgres_primary", 5432, "primary"],
    ["postgres_replica_01", 5432, "replica"],
    ["postgres_replica_02", 5432, "replica"],
    ["postgres_replica_03", 5432, "replica"],
    ["postgres_replica_04", 5432, "replica"],
    ["postgres_replica_05", 5432, "replica"]
]
database = "postgres"

